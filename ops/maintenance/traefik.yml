# Review and install through this server's Coolify Dynamic Configurations.
# This file affects only the two personnel-accounting application domains.
# Append personnel-maintenance-errors@file to the EXISTING application's router
# middleware lists; preserve their generated TLS, redirect and service labels.
# Error-pages schema: https://doc.traefik.io/traefik/reference/routing-configuration/http/middlewares/errorpages/
http:
  routers:
    personnel-static-https:
      rule: (Host(`resurs-otchet.ru`) || Host(`www.resurs-otchet.ru`)) && PathPrefix(`/_next/static/`) && (Method(`GET`) || Method(`HEAD`))
      entryPoints:
        - https
      priority: 2000
      tls:
        certResolver: letsencrypt
      service: personnel-maintenance-fallback
    personnel-maintenance-http:
      rule: Host(`resurs-otchet.ru`) || Host(`www.resurs-otchet.ru`)
      entryPoints:
        - http
      priority: 1
      middlewares:
        - personnel-maintenance-https
      service: personnel-maintenance-fallback
    personnel-maintenance-https:
      rule: Host(`resurs-otchet.ru`) || Host(`www.resurs-otchet.ru`)
      entryPoints:
        - https
      priority: 1
      tls:
        certResolver: letsencrypt
      service: personnel-maintenance-fallback
  middlewares:
    personnel-maintenance-https:
      redirectScheme:
        scheme: https
        permanent: true
    personnel-maintenance-errors:
      chain:
        middlewares:
          - personnel-maintenance-drop-marker
          - personnel-maintenance-errors-handler
    personnel-maintenance-drop-marker:
      headers:
        customRequestHeaders:
          X-Personnel-Maintenance-Request: ""
    personnel-maintenance-errors-handler:
      errors:
        status:
          - "502-504"
        statusRewrites:
          "502-504": 503
        service: personnel-maintenance-fallback
        query: /maintenance?request={url}
        # Coolify normalizes an empty YAML list into {}. A nonempty whitelist
        # survives that round trip; the preceding middleware removes its sole
        # permitted header, so no original request headers reach the error page.
        errorRequestHeaders:
          - X-Personnel-Maintenance-Request
  services:
    personnel-maintenance-fallback:
      loadBalancer:
        passHostHeader: false
        servers:
          - url: http://personnel-maintenance:8099
