name: Deploy to Yandex Cloud

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personnel-production
  cancel-in-progress: false

env:
  YC_CLOUD_ID: b1gdtjg8ebqlmjlq3jmq
  YC_FOLDER_ID: b1guq1t9j5u8drusn9k7
  YC_DEPLOY_SERVICE_ACCOUNT_ID: aje9fkqal3lq87v7simk
  YC_RUNTIME_SERVICE_ACCOUNT_ID: ajepd03985ohdkf99a0u
  YC_REGISTRY_ID: crpp7m2vo4ir2fb1a2q4
  YC_CONTAINER_NAME: personnel-accounting
  YC_NETWORK_ID: enpfooe5uic0dtedbpeb
  IMAGE_REPOSITORY: personnel-accounting

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build and test
        run: npm test

  deploy:
    name: Build and deploy
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Get short-lived Yandex Cloud token
        id: yc-iam-token
        uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
        with:
          yc-sa-id: ${{ env.YC_DEPLOY_SERVICE_ACCOUNT_ID }}

      - name: Log in to Yandex Container Registry
        uses: docker/login-action@v4
        with:
          registry: cr.yandex
          username: iam
          password: ${{ steps.yc-iam-token.outputs.token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy Serverless Container revision
        id: deploy
        uses: yc-actions/yc-sls-container-deploy@v5
        with:
          yc-sa-id: ${{ env.YC_DEPLOY_SERVICE_ACCOUNT_ID }}
          container-name: ${{ env.YC_CONTAINER_NAME }}
          folder-id: ${{ env.YC_FOLDER_ID }}
          revision-service-account-id: ${{ env.YC_RUNTIME_SERVICE_ACCOUNT_ID }}
          revision-cores: 1
          revision-memory: 1Gb
          revision-core-fraction: 100
          revision-concurrency: 4
          revision-image-url: cr.yandex/${{ env.YC_REGISTRY_ID }}/${{ env.IMAGE_REPOSITORY }}:${{ github.sha }}
          revision-execution-timeout: 30
          revision-runtime: http
          revision-provisioned: 0
          revision-network-id: ${{ env.YC_NETWORK_ID }}
          revision-log-options-folder-id: ${{ env.YC_FOLDER_ID }}
          revision-env: |
            APP_ORIGIN=https://bbam7hgvknme98u03f3p.containers.yandexcloud.net;https://d5duh0ld9qfdsho27ocb.y0g3kng5.apigw.yandexcloud.net;https://uchet-personala.ru
            DATABASE_POOL_SIZE=5
            DATABASE_SSL=disable
            MAIL_FROM=no-reply@uchet-personala.ru
            MAIL_PROVIDER=yandex-postbox
            NODE_ENV=production
            PGDATABASE=personnel
            PGHOST=rc1b-p176vla5mhlldu1a.mdb.yandexcloud.net
            PGPORT=6432
            PGUSER=personnel
            PUBLIC_APP_ORIGIN=https://uchet-personala.ru
          revision-secrets: |
            PGPASSWORD=e6qh37vdil0md2uc0dhk/latest/postgresql_password

      - name: Check production site
        run: curl --fail --show-error --silent --retry 5 --retry-delay 5 --retry-all-errors https://uchet-personala.ru/login > /dev/null
