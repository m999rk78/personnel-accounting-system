services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: personnel
      POSTGRES_USER: personnel
      POSTGRES_PASSWORD: personnel
    ports:
      - "5432:5432"
    volumes:
      - personnel-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U personnel -d personnel"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8080
      DATABASE_URL: postgresql://personnel:personnel@postgres:5432/personnel
      DATABASE_SSL: disable
      DATABASE_POOL_SIZE: 5
    ports:
      - "3000:8080"

volumes:
  personnel-postgres:
